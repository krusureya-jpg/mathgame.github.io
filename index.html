<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Math Game จำนวนเต็ม</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1b3a8a">

<style>

body{
font-family:tahoma;
background:#eef3ff;
text-align:center;
}

h1{
color:#1b3a8a;
}

.box{
background:white;
max-width:500px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

#question{
font-size:30px;
margin:20px;
}

button{
padding:10px 20px;
font-size:18px;
margin:10px;
border:none;
background:#1b3a8a;
color:white;
border-radius:8px;
}

input{
font-size:22px;
padding:10px;
width:120px;
text-align:center;
}

#installBtn{
display:none;
background:#28a745;
}

</style>

</head>

<body>

<h1>📚 Math Game จำนวนเต็ม</h1>

<div class="box">

<div id="question"></div>

<input id="answer" type="number">

<br>

<button onclick="checkAnswer()">ตอบ</button>

<button id="installBtn">ติดตั้งแอป</button>

<p id="result"></p>

<p>
คะแนน <span id="score">0</span> |
ชีวิต <span id="life">3</span>
</p>

</div>

<script>

let num1
let num2
let op
let correct
let score=0
let life=3

function rand(){
return Math.floor(Math.random()*20)-10
}

function newQ(){

num1=rand()
num2=rand()

let ops=["+","-","×"]

op=ops[Math.floor(Math.random()*3)]

if(op=="+")correct=num1+num2
if(op=="-")correct=num1-num2
if(op=="×")correct=num1*num2

document.getElementById("question").innerHTML=
num1+" "+op+" "+num2+" = ?"

}

function checkAnswer(){

let ans=Number(document.getElementById("answer").value)

if(ans===correct){

score++
document.getElementById("result").innerHTML="✅ ถูกต้อง"

}else{

life--
document.getElementById("result").innerHTML="❌ ผิด"

}

document.getElementById("score").innerHTML=score
document.getElementById("life").innerHTML=life

if(life<=0){

alert("จบเกม คะแนน "+score)

score=0
life=3

}

newQ()

}

newQ()

</script>

<script>

if('serviceWorker' in navigator){

navigator.serviceWorker.register('service-worker.js')

}

</script>

<script>

let deferredPrompt

const installBtn=document.getElementById("installBtn")

window.addEventListener('beforeinstallprompt',(e)=>{

e.preventDefault()

deferredPrompt=e

installBtn.style.display="inline-block"

})

installBtn.addEventListener('click',async()=>{

deferredPrompt.prompt()

const {outcome}=await deferredPrompt.userChoice

if(outcome==="accepted"){

installBtn.style.display="none"

}

})

</script>

</body>
</html>
